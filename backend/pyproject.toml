[project]
name = "clause-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "python-multipart>=0.0.20", "pypdf>=5,<7", "python-docx>=1.1,<2", "openai>=1.68,<3", "pydantic-settings>=2.8,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]

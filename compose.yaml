services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: clause
      POSTGRES_PASSWORD: clause
      POSTGRES_DB: clause
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clause"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://clause:clause@db:5432/clause
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      WEB_ORIGIN: http://localhost:3000
      DEMO_SEED: ${DEMO_SEED:-true}
    volumes:
      - uploads:/app/backend/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres:
  uploads:
